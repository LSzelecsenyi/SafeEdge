# Local development profile. Activated by `./gradlew bootRun` (and `.\gradlew.bat bootRun`).
# Override credentials via environment variables; do not commit secrets.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:safeedge}
    username: ${DB_USERNAME:safeedge}
    password: ${DB_PASSWORD:safeedge}
