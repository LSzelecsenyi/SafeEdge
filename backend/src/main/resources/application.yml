spring:
  application:
    name: safeedge
  jackson:
    time-zone: UTC
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:safeedge}
    username: ${DB_USERNAME:safeedge}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

safeedge:
  providers:
    tippmix:
      base-url: ${TIPPMIX_BASE_URL:https://api.tippmix.hu}
      manual-event-id: ${TIPPMIX_MANUAL_EVENT_ID:}
      collector:
        enabled: ${TIPPMIX_COLLECTOR_ENABLED:true}
        fixed-delay: ${TIPPMIX_COLLECTOR_FIXED_DELAY:PT5M}
        page-size: ${TIPPMIX_COLLECTOR_PAGE_SIZE:20}
        max-pages: ${TIPPMIX_COLLECTOR_MAX_PAGES:50}
      results:
        enabled: ${TIPPMIX_RESULTS_ENABLED:false}
        fixed-delay: ${TIPPMIX_RESULTS_FIXED_DELAY:PT15M}
    football-data:
      base-url: ${FOOTBALL_DATA_BASE_URL:https://www.football-data.co.uk}
      manual-league: ${SAFEEDGE_HISTORICAL_LEAGUE:}
      manual-season-start: ${SAFEEDGE_HISTORICAL_SEASON_START:}
      bulk-start-season: ${SAFEEDGE_HISTORICAL_BULK_START_SEASON:}
      bulk-end-season: ${SAFEEDGE_HISTORICAL_BULK_END_SEASON:}
      bulk-leagues: ${SAFEEDGE_HISTORICAL_BULK_LEAGUES:}
  historical:
    features:
      competition: ${SAFEEDGE_HISTORICAL_FEATURES_COMPETITION:}
      from-season: ${SAFEEDGE_HISTORICAL_FEATURES_FROM_SEASON:}
      to-season: ${SAFEEDGE_HISTORICAL_FEATURES_TO_SEASON:}
    backtest:
      competition: ${SAFEEDGE_HISTORICAL_BACKTEST_COMPETITION:}
      training-from-season: ${SAFEEDGE_HISTORICAL_BACKTEST_TRAINING_FROM_SEASON:}
      from-season: ${SAFEEDGE_HISTORICAL_BACKTEST_FROM_SEASON:}
      to-season: ${SAFEEDGE_HISTORICAL_BACKTEST_TO_SEASON:}
      quote-source: ${SAFEEDGE_HISTORICAL_BACKTEST_QUOTE_SOURCE:}
      starting-bankroll: ${SAFEEDGE_HISTORICAL_BACKTEST_STARTING_BANKROLL:100000}
      max-accepted-bets: ${SAFEEDGE_HISTORICAL_BACKTEST_MAX_ACCEPTED_BETS:}
